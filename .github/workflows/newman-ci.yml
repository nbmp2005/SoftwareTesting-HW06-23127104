name: CI/CD API Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  newman-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository (Tests)
      uses: actions/checkout@v4

    - name: Clone Backend (EShop SUT)
      run: git clone https://github.com/ttbhanh/eshop-sut.git backend

    - name: Setup Node & Start EShop Backend
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and start server
      run: |
        cd backend/backend
        npm install
        node database.js
        node server.js &
        sleep 10 # Đợi server khởi động (đảm bảo port 3000 sẵn sàng)

    - name: Setup Node.js for Newman
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Newman & HTML Extra Reporter
      run: |
        npm install -g newman
        npm install -g newman-reporter-htmlextra

    - name: Run Newman Tests (FR-02)
      run: |
        newman run HW06_Eshop.postman_collection.json \
          -d FR02_data.csv \
          --env-var "baseUrl=http://localhost:3000" \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export newman-report-FR02.html
      continue-on-error: true

    - name: Run Newman Tests (FR-10)
      run: |
        newman run HW06_Eshop.postman_collection.json \
          -d FR10_data.csv \
          --env-var "baseUrl=http://localhost:3000" \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export newman-report-FR10.html
      continue-on-error: true

    - name: Run Newman Tests (FR-15)
      run: |
        newman run HW06_Eshop.postman_collection.json \
          -d FR15_data.csv \
          --env-var "baseUrl=http://localhost:3000" \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export newman-report-FR15.html
      continue-on-error: true

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: newman-reports
        path: |
          newman-report-FR02.html
          newman-report-FR10.html
          newman-report-FR15.html
